<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            font-family: 'PingFang SC', 'Songti SC', 'STSong', serif;
            color: #1A1A1A;
            background-color: #F3E9D2;
            position: relative;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(45deg,
                    transparent 0 3px,
                    rgba(160, 140, 100, 0.04) 3px 4px),
                repeating-linear-gradient(-45deg,
                    transparent 0 2px,
                    rgba(160, 140, 100, 0.03) 2px 5px),
                repeating-linear-gradient(0deg,
                    transparent 0 1px,
                    rgba(160, 140, 100, 0.02) 1px 4px);
            pointer-events: none;
            z-index: 0;
        }

        .border-outer {
            position: absolute;
            top: 80px; left: 80px; right: 80px; bottom: 80px;
            border: 1px solid rgba(158, 43, 37, 0.35);
            pointer-events: none;
            z-index: 2;
        }

        .border-inner {
            position: absolute;
            top: 86px; left: 86px; right: 86px; bottom: 86px;
            border: 1px solid rgba(158, 43, 37, 0.12);
            pointer-events: none;
            z-index: 2;
        }

        .seal {
            position: absolute;
            bottom: 80px;
            left: 80px;
            width: 64px;
            height: 64px;
            border: 3px solid #9E2B25;
            color: #9E2B25;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(-6deg);
            opacity: 0.85;
            pointer-events: none;
            z-index: 3;
            background: rgba(158, 43, 37, 0.08);
            line-height: 1;
            text-align: center;
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            writing-mode: vertical-rl;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 60px;
        }

        .title {
            font-size: 60px;
            font-weight: 700;
            letter-spacing: 18px;
            line-height: 1.6;
            color: #1A1A1A;
            white-space: nowrap;
        }

        .text {
            font-size: clamp(28px, 4vw, 52px);
            line-height: clamp(1.6, 2.0, 2.2);
            letter-spacing: 10px;
            color: #1A1A1A;
            text-align: justify;
            white-space: pre-line;
            max-height: 1400px;
        }
    </style>
</head>
<body>
    <div class="border-outer"></div>
    <div class="border-inner"></div>
    <div class="seal">古本</div>
    <div class="content">
        <div class="title">{{title}}</div>
        <div class="text">{{text}}</div>
    </div>
</body>
</html>
